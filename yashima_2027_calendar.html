<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027年 営業日カレンダー｜八洲薬品株式会社</title>
<style>
:root{--ink:#243142;--muted:#667789;--line:#dce3e9;--red:#df3d42;--blue:#1785cb;--bg:#f5f7f9;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:transparent}
.wrapper{max-width:1120px;margin:0 auto;padding:clamp(12px,3vw,36px) clamp(12px,3vw,28px) 24px}
.header{text-align:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:700;color:#667789;margin:0 0 8px}.header h1{font-size:clamp(22px,3vw,32px);line-height:1.35;letter-spacing:.04em;margin:0 0 9px}.header p{color:var(--muted);font-size:13px;margin:0}
.legend{display:flex;justify-content:center;align-items:center;gap:12px 20px;flex-wrap:wrap;margin:20px 0 25px;font-size:12px;color:#455565}.legend-item{display:inline-flex;gap:7px;align-items:center}.sample{width:23px;height:23px;display:grid;place-items:center;font-weight:700;font-size:12px}.sample.closed{border:2px solid var(--red);border-radius:50%;color:var(--blue)}.sample.special{border:2px solid var(--blue);color:var(--blue)}.sample.holiday{color:var(--red)}
.calendars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.month{border:1px solid var(--line);border-radius:10px;background:var(--white);overflow:hidden;box-shadow:0 2px 8px rgba(29,45,61,.035)}.month-title{margin:0;padding:12px 10px;text-align:center;font-weight:700;font-size:15px;border-bottom:1px solid var(--line);background:#fafbfc}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:10px 9px 13px;gap:4px 0}.dow,.day{display:flex;align-items:center;justify-content:center;min-width:0}.dow{font-size:11px;font-weight:600;color:#586674;height:25px;margin-bottom:3px}.dow.sun,.day.sunday,.day.holiday{color:var(--red)}.dow.sat,.day.saturday{color:var(--blue)}.day{font-size:12px;height:30px;position:relative;font-variant-numeric:tabular-nums}.day span{height:27px;width:27px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;border-radius:50%}.day.company-closed span{border-color:var(--red)}.day.special span{border-color:var(--blue);border-radius:2px}.day.empty{visibility:hidden}.day .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.note{margin:18px auto 0;max-width:900px;text-align:center;color:var(--muted);line-height:1.8;font-size:12px}.pdf-link{margin:19px auto 0;display:flex;align-items:center;justify-content:center;width:fit-content;max-width:100%;padding:11px 20px;border:1px solid #a5b3c0;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;transition:background .2s}.pdf-link:hover{background:#eef2f5}.pdf-link:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:790px){.calendars{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}@media(max-width:510px){.wrapper{padding:16px 12px 22px}.calendars{grid-template-columns:1fr;gap:14px}.month-title{font-size:17px;padding:13px}.days{padding:11px 12px 15px}.day{height:37px;font-size:14px}.day span{width:32px;height:32px}.dow{font-size:13px;height:29px}.header{margin-bottom:15px}.legend{margin:16px 0 19px;justify-content:flex-start;font-size:11px}}
</style>
</head>
<body>
<main class="wrapper">
<header class="header"><p class="eyebrow">BUSINESS CALENDAR</p><h1>2027年 営業日カレンダー</h1><p>八洲薬品株式会社</p></header>
<div class="legend" aria-label="カレンダーの見方"><span class="legend-item"><span class="sample closed">土</span>赤丸：会社指定の休業日</span><span class="legend-item"><span class="sample holiday">日</span>赤文字：日曜・祝日</span><span class="legend-item"><span class="sample special">土</span>青枠：原本の特別指定日</span></div>
<section class="calendars" id="calendars" aria-label="2027年1月から12月のカレンダー"></section>
<p class="note">※ 赤丸・青枠は、八洲薬品の2027年カレンダー画像の表示に合わせています。青枠の日の営業扱いについては原本または会社にご確認ください。</p>
<a class="pdf-link" href="https://www.yashimachem.co.jp/2027calendar.pdf" target="_blank" rel="noopener noreferrer">2027年カレンダーをPDFで見る ↗</a>
</main>
<script>
// 添付された2027年年間カレンダーの赤丸（会社指定の休業日）を月ごとに転記。
const closed = {
  1:[1,2,4,9,16,23,30],2:[6,13,20,27],3:[6,13,20,27],
  4:[3,10,17,24],5:[1,8,15,29],6:[5,12,19,26],
  7:[3,10,17,24,31],8:[7,10,12,13,14,28],9:[4,11,18,25],
  10:[2,9,16,23,30],11:[6,13,27],12:[4,11,18,25,30,31]
};
// 添付画像で青い四角枠で示されている日付。
const special = {5:[22],8:[21],11:[20]};
// 2027年の日本の祝日・振替休日（画像で赤文字になっている日付に対応）。
const holidayNames = {
 '1-1':'元日','1-11':'成人の日','2-11':'建国記念の日','2-23':'天皇誕生日',
 '3-21':'春分の日','3-22':'振替休日','4-29':'昭和の日',
 '5-3':'憲法記念日','5-4':'みどりの日','5-5':'こどもの日',
 '7-19':'海の日','8-11':'山の日','9-20':'敬老の日','9-23':'秋分の日',
 '10-11':'スポーツの日','11-3':'文化の日','11-23':'勤労感謝の日'
};
const weekdays=['日','月','火','水','木','金','土'];
const target=document.getElementById('calendars');
for(let month=1;month<=12;month++){
 const start=new Date(2027,month-1,1).getDay();
 const last=new Date(2027,month,0).getDate();
 const article=document.createElement('article');article.className='month';
 const heading=document.createElement('h2');heading.className='month-title';heading.textContent=month+'月';article.appendChild(heading);
 const grid=document.createElement('div');grid.className='days';grid.setAttribute('role','grid');grid.setAttribute('aria-label','2027年'+month+'月');
 weekdays.forEach((w,i)=>{const el=document.createElement('div');el.className='dow'+(i===0?' sun':i===6?' sat':'');el.textContent=w;grid.appendChild(el)});
 for(let i=0;i<start;i++){const el=document.createElement('div');el.className='day empty';el.setAttribute('aria-hidden','true');grid.appendChild(el)}
 for(let d=1;d<=last;d++){
  const dayOfWeek=new Date(2027,month-1,d).getDay(),holiday=holidayNames[month+'-'+d],isClosed=(closed[month]||[]).includes(d),isSpecial=(special[month]||[]).includes(d);
  const el=document.createElement('div');el.className='day'+(dayOfWeek===0?' sunday':dayOfWeek===6?' saturday':'')+(holiday?' holiday':'')+(isClosed?' company-closed':'')+(isSpecial?' special':'');
  const sp=document.createElement('span');sp.textContent=d;el.appendChild(sp);
  const a11y=['2027年'+month+'月'+d+'日',weekdays[dayOfWeek]+'曜日',holiday,isClosed?'会社指定休業日':'',isSpecial?'青枠の特別指定日':''].filter(Boolean).join('、');el.setAttribute('role','gridcell');el.setAttribute('aria-label',a11y);el.title=a11y;grid.appendChild(el);
 }
 article.appendChild(grid);target.appendChild(article);
}
// STUDIO iframe内でコンテンツが余白なく収まるよう、親ページへ高さを通知。
(function(){const report=()=>{const h=Math.ceil(document.documentElement.scrollHeight);window.parent.postMessage({type:'YASHIMA_CALENDAR_HEIGHT',height:h},'*')};window.addEventListener('load',report);window.addEventListener('resize',report);if('ResizeObserver'in window){new ResizeObserver(report).observe(document.body)}report()})();
</script>
</body>
</html>
